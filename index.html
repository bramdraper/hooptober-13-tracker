            }
        }

        function applyDateSorting() {
            if (!isLockedByDate) return;

            const withDate = [];
            const withoutDate = [];

            slots.forEach(s => {
                if (s.title && s.viewingDate && s.viewingDate.trim() !== '') {
                    withDate.push(s);
                } else {
                    withoutDate.push(s);
                }
            });

            withDate.sort((a, b) => new Date(a.viewingDate) - new Date(b.viewingDate));

            slots = [...withDate, ...withoutDate];
            saveState();
        }

        function saveState() {
            slots.forEach((s, idx) => s.id = idx + 1);
            localStorage.setItem('hoop13_slots', JSON.stringify(slots));
            render();
            scheduleSync();
        }

        function moveSlot(idx, direction) {
            if (activeGroupMode) return;
            const datedCount = slots.filter(s => s.title && s.viewingDate).length;
            if (isLockedByDate && idx < datedCount) return;
            const newIdx = idx + direction;
            if (newIdx < 0 || newIdx >= slots.length) return;
            if (isLockedByDate && newIdx < datedCount) return;

            const temp = slots[idx];
            slots[idx] = slots[newIdx];
            slots[newIdx] = temp;
            saveState();
        }

        function addNewSlot() {
            slots.push({
                id: slots.length + 1, title: '', year: '', country: '', director: '', poster: '', tmdbId: '', status: 'Planned', viewingDate: '', notes: '', tags: []
            });
            saveState();
            openQuickSearch({ stopPropagation: () => {} }, slots.length - 1);
        }

        function extractTmdbId(inputStr) {
            if (!inputStr) return null;
            const str = inputStr.trim();
            if (/^\d+$/.test(str)) return str;
            const match = str.match(/\/movie\/(\d+)/i);
            return match ? match[1] : null;
        }

        const TMDB_PROXY_URL = 'https://hooptober-tmdb.bram-draper.workers.dev';
        const PROXY_HOSTS = ['bramdraper.github.io'];

        function getSavedTmdbKey() {
            try { return localStorage.getItem('hoop13_tmdb_key') || ''; } catch (e) { return ''; }
        }

        function isProxyAvailable() {
            return location.protocol === 'https:' && PROXY_HOSTS.includes(location.hostname);
        }

        // Truthy when TMDb lookups can run: a saved key, or the hosted site's proxy
        function getTmdbAccess() {
            return getSavedTmdbKey() || (isProxyAvailable() ? 'proxy' : '');
        }

        function tmdbApiBase() {
            return getSavedTmdbKey() ? 'https://api.themoviedb.org' : TMDB_PROXY_URL;
        }

        function tmdbKeyParam() {
            const key = getSavedTmdbKey();
            return key ? `api_key=${encodeURIComponent(key)}&` : '';
        }

        // ---------- Sync between browsers ----------
        const SYNC_URL = TMDB_PROXY_URL + '/sync';
        const SYNC_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        const SYNC_CODE_PATTERN = /^HOOP-[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}$/;
        const SYNC_DELAY_MS = 4000;
        let syncTimer = null;
        let syncReady = false;
        let syncInFlight = false;
        let syncConflictPending = false;

        function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        function lsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }

        function getSyncCode() { return lsGet('hoop13_sync_code') || ''; }
        function getSyncBase() { const v = lsGet('hoop13_sync_base'); return v ? Number(v) : null; }
        function syncPayload() { return { slots: slots, locked: isLockedByDate }; }
        function syncPayloadText() { return JSON.stringify(syncPayload()); }
        function hasUnsyncedChanges() { return syncPayloadText() !== lsGet('hoop13_sync_snapshot'); }

        function normalizeSyncCode(raw) {
            const chars = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^HOOP/, '');
            if (chars.length !== 16) return '';
            const code = 'HOOP-' + chars.match(/.{4}/g).join('-');
            return SYNC_CODE_PATTERN.test(code) ? code : '';
        }

        function generateSyncCode() {
            const bytes = new Uint8Array(16);
            crypto.getRandomValues(bytes);
            const chars = Array.from(bytes, b => SYNC_ALPHABET[b % 32]).join('');
            return 'HOOP-' + chars.match(/.{4}/g).join('-');
        }

        function setSyncStatus(text, kind) {
            const el = document.getElementById('syncStatus');
            if (!el) return;
            el.textContent = text;
            el.className = 'sync-status' + (kind ? ' ' + kind : '');
        }

        function markSynced(updatedAt) {
            lsSet('hoop13_sync_base', String(updatedAt));
            lsSet('hoop13_sync_snapshot', syncPayloadText());
            setSyncStatus('Synced', 'ok');
        }

        async function syncRequest(method, body, keepalive) {
            return fetch(SYNC_URL, {
                method,
                headers: { 'X-Sync-Code': getSyncCode(), ...(body ? { 'Content-Type': 'application/json' } : {}) },
                body: body ? JSON.stringify(body) : undefined,
                cache: 'no-store',
                keepalive: !!keepalive
            });
        }

        function scheduleSync() {
            if (!getSyncCode() || !syncReady || syncConflictPending) return;
            if (!hasUnsyncedChanges()) { if (!syncInFlight) setSyncStatus('Synced', 'ok'); return; }
            setSyncStatus('Unsaved…', 'warn');
            clearTimeout(syncTimer);
            syncTimer = setTimeout(pushSync, SYNC_DELAY_MS);
        }

        async function pushSync(force = false) {
            clearTimeout(syncTimer);
            syncTimer = null;
            if (!getSyncCode()) return;
            if (syncInFlight) { syncTimer = setTimeout(pushSync, 1000); return; }
            syncInFlight = true;
            setSyncStatus('Saving…', 'warn');
            const sentText = syncPayloadText();
            try {
                const res = await syncRequest('PUT', { data: JSON.parse(sentText), baseUpdatedAt: getSyncBase(), force });
                if (res.status === 409) {
                    syncInFlight = false;
                    await pullSync(true);
                    return;
                }
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const out = await res.json();
                lsSet('hoop13_sync_base', String(out.updatedAt));
                lsSet('hoop13_sync_snapshot', sentText);
                syncInFlight = false;
                if (hasUnsyncedChanges()) scheduleSync(); else setSyncStatus('Synced', 'ok');
            } catch (e) {
                syncInFlight = false;
                console.error('Sync save failed', e);
                setSyncStatus(navigator.onLine === false ? 'Offline' : 'Sync error', 'err');
            }
        }

        function applyRemoteData(remote) {
            const data = remote.data || {};
            if (!Array.isArray(data.slots)) return false;
            slots = data.slots;
            isLockedByDate = !!data.locked;
            const toggle = document.getElementById('lockByDateToggle');
            if (toggle) toggle.checked = isLockedByDate;
            lsSet('hoop13_locked', JSON.stringify(isLockedByDate));
            slots.forEach((s, idx) => s.id = idx + 1);
            lsSet('hoop13_slots', JSON.stringify(slots));
            markSynced(remote.updatedAt);
            render();
            return true;
        }

        // Fetches the saved list; applies it, pushes local changes, or asks about a conflict
        async function pullSync(fromConflict = false) {
            if (!getSyncCode() || syncInFlight || syncConflictPending) return;
            syncInFlight = true;
            if (!fromConflict) setSyncStatus('Checking…', 'warn');
            try {
                const res = await syncRequest('GET');
                syncInFlight = false;
                if (res.status === 404) {
                    syncReady = true;
                    await pushSync(true);
                    return;
                }
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const remote = await res.json();
                syncReady = true;
                const base = getSyncBase();
                if (remote.updatedAt === base && !fromConflict) {
                    if (hasUnsyncedChanges()) scheduleSync(); else setSyncStatus('Synced', 'ok');
                } else if (!hasUnsyncedChanges()) {
                    applyRemoteData(remote);
                } else {
                    showSyncConflict(remote);
                }
            } catch (e) {
                syncInFlight = false;
                syncReady = true;
                console.error('Sync load failed', e);
                setSyncStatus(navigator.onLine === false ? 'Offline' : 'Sync error', 'err');
            }
        }

        function countFilms(list) { return (list || []).filter(s => s && s.title).length; }

        function openSyncModal() {
            const body = document.getElementById('syncModalBody');
            const code = getSyncCode();
            document.getElementById('syncModalTitle').textContent = 'Sync between browsers';
            if (code) {
                body.innerHTML = `
                    <p class="sync-modal-text">Sync is on. Enter this code on another browser to load the same list. Anyone with the code can see and edit it, so keep it private.</p>
                    <div class="sync-code-box" id="syncCodeShown">${escapeHtml(code)}</div>
                    <div class="sync-modal-actions">
                        <button onclick="copySyncCode()">Copy code</button>
                        <button class="btn-secondary" onclick="pullSync(); closeSyncModal();">Sync now</button>
                        <button class="btn-secondary" onclick="turnOffSync()">Turn off on this browser</button>
                    </div>`;
            } else {
                body.innerHTML = `
                    <p class="sync-modal-text">Keep your list in sync across browsers and devices. Start sync here to get a code, or enter a code you already have.</p>
                    <div class="sync-modal-actions" style="margin-top:0; margin-bottom:16px;">
                        <button onclick="startNewSync()">Turn on sync</button>
                    </div>
                    <label class="sync-modal-text" style="display:block; margin-bottom:6px;">I have a code</label>
                    <input class="sync-code-input" id="syncCodeInput" placeholder="HOOP-XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
                    <div class="sync-modal-actions">
                        <button onclick="joinSyncWithCode()">Load my list</button>
                    </div>`;
            }
            document.getElementById('syncModalClose').style.display = '';
            document.getElementById('syncModalOverlay').classList.add('active');
        }

        function closeSyncModal() {
            if (syncConflictPending) return;
            document.getElementById('syncModalOverlay').classList.remove('active');
        }

        function copySyncCode() {
            const code = getSyncCode();
            const done = () => setSyncStatus('Code copied', 'ok');
            if (navigator.clipboard) navigator.clipboard.writeText(code).then(done).catch(() => {});
        }

        async function startNewSync() {
            const code = generateSyncCode();
            lsSet('hoop13_sync_code', code);
            lsSet('hoop13_sync_base', null);
            lsSet('hoop13_sync_snapshot', null);
            syncReady = true;
            openSyncModal();
            document.getElementById('syncModalTitle').textContent = 'Sync is on — save this code';
            await pushSync(true);
        }

        async function joinSyncWithCode() {
            const input = document.getElementById('syncCodeInput');
            const code = normalizeSyncCode(input ? input.value : '');
            if (!code) { alert('That code doesn\'t look right. It should look like HOOP-XXXX-XXXX-XXXX-XXXX.'); return; }
            const prevCode = getSyncCode();
            lsSet('hoop13_sync_code', code);
            try {
                const res = await syncRequest('GET');
                if (res.status === 404) {
                    lsSet('hoop13_sync_code', prevCode || null);
                    alert('No list was found for that code. Check it and try again.');
                    return;
                }
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const remote = await res.json();
                const localCount = countFilms(slots);
                if (localCount > 0 && !confirm(`Replace this browser's list (${localCount} films) with the synced list (${countFilms(remote.data && remote.data.slots)} films)?\n\nTip: export a CSV first if you want a backup of this browser's list.`)) {
                    lsSet('hoop13_sync_code', prevCode || null);
                    return;
                }
                syncReady = true;
                applyRemoteData(remote);
                syncMissingPosters();
                openSyncModal();
            } catch (e) {
                lsSet('hoop13_sync_code', prevCode || null);
                console.error('Sync join failed', e);
                alert('Couldn\'t reach the sync service. Check your connection and try again.');
            }
        }

        function turnOffSync() {
            if (!confirm('Turn off sync on this browser? Your list stays here and in the cloud; you can turn sync back on with the same code.')) return;
            clearTimeout(syncTimer);
            lsSet('hoop13_sync_code', null);
            lsSet('hoop13_sync_base', null);
            lsSet('hoop13_sync_snapshot', null);
            setSyncStatus('Sync off', '');
            closeSyncModal();
        }

        function showSyncConflict(remote) {
            syncConflictPending = true;
            clearTimeout(syncTimer);
            setSyncStatus('Needs a choice', 'warn');
            window.__syncConflictRemote = remote;
            const when = remote.updatedAt ? new Date(remote.updatedAt).toLocaleString() : 'recently';
            document.getElementById('syncModalTitle').textContent = 'Two versions of your list';
            document.getElementById('syncModalBody').innerHTML = `
                <p class="sync-modal-text">This browser has changes that weren't synced, and another browser saved a different version (${escapeHtml(when)}). Which one should be kept?</p>
                <p class="sync-modal-text">This browser: <strong>${countFilms(slots)}</strong> films &nbsp;·&nbsp; Other version: <strong>${countFilms(remote.data && remote.data.slots)}</strong> films</p>
                <div class="sync-modal-actions">
                    <button onclick="resolveSyncConflict('remote')">Use the other version</button>
                    <button class="btn-secondary" onclick="resolveSyncConflict('local')">Keep this browser's version</button>
                </div>
                <p class="sync-modal-text" style="margin-top:12px;">The version you don't pick is replaced. Export a CSV first if you want a backup.</p>`;
            document.getElementById('syncModalClose').style.display = 'none';
            document.getElementById('syncModalOverlay').classList.add('active');
        }

        async function resolveSyncConflict(choice) {
            const remote = window.__syncConflictRemote;
            syncConflictPending = false;
            window.__syncConflictRemote = null;
            document.getElementById('syncModalClose').style.display = '';
            document.getElementById('syncModalOverlay').classList.remove('active');
            if (choice === 'remote' && remote) {
                applyRemoteData(remote);
                syncMissingPosters();
            } else {
                await pushSync(true);
            }
        }

        function initSync() {
            if (!isProxyAvailable()) return;
            document.getElementById('syncWrap').style.display = '';
            if (!getSyncCode()) { setSyncStatus('Sync off', ''); return; }
            pullSync();
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    if (syncTimer) pushSync(); else pullSync();
                } else if (syncTimer && hasUnsyncedChanges()) {
                    clearTimeout(syncTimer);
                    syncTimer = null;
                    const sentText = syncPayloadText();
                    syncRequest('PUT', { data: JSON.parse(sentText), baseUpdatedAt: getSyncBase() }, sentText.length < 60000)
                        .then(r => r.ok ? r.json() : null)
                        .then(out => { if (out) { lsSet('hoop13_sync_base', String(out.updatedAt)); lsSet('hoop13_sync_snapshot', sentText); setSyncStatus('Synced', 'ok'); } })
                        .catch(() => {});
                }
            });
            window.addEventListener('online', () => { if (hasUnsyncedChanges()) pushSync(); else pullSync(); });
        }

        function renderApiConfig() {
            const key = getSavedTmdbKey();
            const container = document.getElementById('apiConfigContainer');
            if (!key && isProxyAvailable()) {
                container.innerHTML = `<div class="api-status-badge" title="TMDb lookups run through the tracker's proxy. No key needed.">✓ TMDb</div>`;
            } else if (key) {
                container.innerHTML = `<div class="api-status-badge">✓ TMDb</div><button class="btn-secondary" style="padding:2px 6px; font-size:0.75rem;" onclick="editApiKey()">Edit</button>`;
            } else {
                container.innerHTML = `<input type="password" id="tmdbKeyInput" placeholder="TMDb API Key..."><button style="padding:4px 8px; font-size:0.75rem;" onclick="saveApiKey()">Save</button>`;
            }
        }

        function saveApiKey() {
            const input = document.getElementById('tmdbKeyInput');
            if (input && input.value.trim()) {
                localStorage.setItem('hoop13_tmdb_key', input.value.trim());
                renderApiConfig();
                syncMissingPosters();
            }
        }

        function editApiKey() {
            const currentKey = localStorage.getItem('hoop13_tmdb_key') || '';
            document.getElementById('apiConfigContainer').innerHTML = `<input type="password" id="tmdbKeyInput" value="${escapeHtml(currentKey)}"><button style="padding:4px 8px; font-size:0.75rem;" onclick="saveApiKey()">Save</button><button class="btn-secondary" style="padding:4px 8px; font-size:0.75rem;" onclick="renderApiConfig()">Cancel</button>`;
        }

        function getPosterFile(posterUrl) {
            if (!posterUrl) return '';
            const file = String(posterUrl).split('?')[0].split('/').pop();
            return file && file.includes('.') ? '/' + file : '';
        }

        let isRepairingIds = false;

        async function repairMissingIds() {
            if (isRepairingIds) return;
            const apiKey = getTmdbAccess();
            if (!apiKey) { alert('Add your TMDb API key first, then try again.'); return; }

            const targets = slots.filter(s => s.title && !s.tmdbId);
            if (targets.length === 0) { alert('Every film already has a TMDb ID. Nothing to repair.'); return; }
            if (!confirm(`Look up TMDb IDs for ${targets.length} film(s) missing one?\n\nTip: export a CSV first as a backup.`)) return;

            isRepairingIds = true;
            const btn = document.getElementById('repairIdsBtn');
            if (btn) { btn.textContent = '⏳'; btn.disabled = true; }

            let exactCount = 0;
            const uncertain = [];
            const failed = [];

            for (const s of targets) {
                try {
                    const res = await fetch(`${tmdbApiBase()}/3/search/movie?${tmdbKeyParam()}query=${encodeURIComponent(s.title)}&include_adult=false`);
                    const data = await res.json();
                    const results = (data && data.results) || [];
                    const posterFile = getPosterFile(s.poster);
                    const resultYear = r => r.release_date ? parseInt(r.release_date.split('-')[0], 10) : null;

                    let match = posterFile ? results.find(r => r.poster_path && r.poster_path === posterFile) : null;
                    let isExact = !!match;
                    if (!match && results.length > 0) {
                        match = (s.year ? results.find(r => resultYear(r) === parseInt(s.year, 10)) : null) || results[0];
                    }

                    if (!match) { failed.push(`${s.title}: no TMDb results`); continue; }

                    const usedElsewhere = slots.find(o => o !== s && o.tmdbId && String(o.tmdbId) === String(match.id));
                    if (usedElsewhere) { failed.push(`${s.title}: best match is already in slot #${usedElsewhere.id}`); continue; }

                    s.tmdbId = match.id;
                    if (!s.poster && match.poster_path) s.poster = `https://image.tmdb.org/t/p/w185${match.poster_path}`;

                    if (isExact) {
                        exactCount++;
                    } else {
                        const y = resultYear(match);
                        uncertain.push(`${s.title} → ${match.title}${y ? ` (${y})` : ''}`);
                    }
                } catch (e) {
                    console.error('Repair lookup failed for', s.title, e);
                    failed.push(`${s.title}: lookup error`);
                }
            }

            isRepairingIds = false;
            if (btn) { btn.textContent = '🔧'; btn.disabled = false; }
            saveState();

            let msg = `Repaired ${exactCount + uncertain.length} of ${targets.length}.\n${exactCount} matched exactly by poster.`;
            if (uncertain.length) msg += `\n\nMatched by title/year. Please double-check these:\n- ${uncertain.join('\n- ')}`;
            if (failed.length) msg += `\n\nNot repaired:\n- ${failed.join('\n- ')}`;
            msg += `\n\nExport a fresh CSV to keep these IDs.`;
            alert(msg);
        }

        async function syncMissingPosters() {
            const apiKey = getTmdbAccess();
            if (!apiKey) return;

            let updated = false;
            for (let i = 0; i < slots.length; i++) {
                const s = slots[i];
                if (s.tmdbId && (!s.poster || s.poster.endsWith('/'))) {
                    try {
                        const res = await fetch(`${tmdbApiBase()}/3/movie/${s.tmdbId}?${tmdbKeyParam()}`);
                        const data = await res.json();
                        if (data && data.poster_path) {
                            s.poster = `https://image.tmdb.org/t/p/w185${data.poster_path}`;
                            updated = true;
                        }
                    } catch (e) { console.error('Error auto-syncing poster for TMDb ID:', s.tmdbId, e); }
                }
            }
            if (updated) {
                saveState();
            }
        }

        function getMovieCategories(slot) {
            if (!slot.title) return [];
            const categories = [];

            const decadeRule = RULES_DEF.find(r => r.id === 'd9');
            const isDecadeRuleComplete = decadeRule ? decadeRule.getCount(slots) >= decadeRule.target : false;

            if (slot.year) {
                const decade = Math.floor(slot.year / 10) * 10;
                categories.push({
                    label: `decade: ${decade}s`,
                    isComplete: isDecadeRuleComplete
                });
            }

            const countryRule = RULES_DEF.find(r => r.id === 'c6');
            const isCountryRuleComplete = countryRule ? countryRule.getCount(slots) >= countryRule.target : false;

            if (slot.country) {
                const normCountry = normalizeCountryName(slot.country);
                categories.push({
                    label: `Country: ${getCountryFlag(normCountry)} ${normCountry}`,
                    isComplete: isCountryRuleComplete
                });
            }

            RULES_DEF.forEach(r => {
                if (r.id !== 'count31' && r.id !== 'c6' && r.id !== 'd9') {
                    if (r.appliesTo && r.appliesTo(slot)) {
                        const count = r.getCount(slots);
                        categories.push({
                            label: r.label,
                            isComplete: count >= r.target
                        });
                    }
                }
            });

            return categories;
        }

        function filterByRule(ruleId) {
            if (ruleId === 'count31') return;

            if (ruleId === 'd9') {
                activeRuleFilter = null;
                activeGroupMode = activeGroupMode === 'decades' ? null : 'decades';
                render();
                return;
            }

            if (ruleId === 'c6') {
                activeRuleFilter = null;
                activeGroupMode = activeGroupMode === 'countries' ? null : 'countries';
                render();
                return;
            }

            activeGroupMode = null;
            if (activeRuleFilter === ruleId) {
                activeRuleFilter = null;
            } else {
                activeRuleFilter = ruleId;
            }
            render();
        }

        function clearAllFilters() {
            activeGroupMode = null;
            activeRuleFilter = null;
            render();
        }

        function sortMoviesForTooltip(movieList) {
            return [...movieList].sort((a, b) => {
                if (a.status === 'Watched' && b.status !== 'Watched') return -1;
                if (a.status !== 'Watched' && b.status === 'Watched') return 1;
                return 0;
            });
        }

        function renderSingleCard(s, realIdx, isGrouped = false) {
            const safeTitle = escapeHtml(s.title);
            const yearStr = s.year ? `<span class="year-paren">(${s.year})</span>` : '';
            
            const titleLink = s.title 
                ? (s.tmdbId 
                    ? `<a href="https://www.themoviedb.org/movie/${encodeURIComponent(s.tmdbId)}" target="_blank" rel="noopener">${safeTitle}</a>${yearStr}`
                    : `${safeTitle}${yearStr}`)
                : `<span class="empty-slot-trigger" onclick="openQuickSearch(event, ${realIdx})" title="Click to search movie">Add Movie</span>`;

            const appliedCats = getMovieCategories(s);
            const tooltipHtml = appliedCats.length > 0 ? `
                <div class="poster-tooltip">
                    <div class="tooltip-header">${safeTitle}</div>
                    <ul class="tooltip-list">
                        ${appliedCats.map(c => `
                            <li class="tooltip-item">
                                <span class="tooltip-item-left">${escapeHtml(c.label)}</span>
                                ${c.isComplete ? `<span class="tooltip-item-check" title="Category completed!">✓</span>` : ''}
                            </li>
                        `).join('')}
                    </ul>
                </div>
            ` : '';

            const posterHtml = (s.poster && s.poster !== 'https://image.tmdb.org/t/p/w185/')
                ? `<img class="slot-poster" src="${s.poster}" alt="Poster">`
                : SPOOKY_REEL_SVG;

            const topRightIndicator = s.viewingDate 
                ? getCalendarIconHtml(s.viewingDate) 
                : `<span class="slot-num-text">#${realIdx + 1}</span>`;

            const datedCount = slots.filter(st => st.title && st.viewingDate).length;
            const isItemLocked = isLockedByDate && realIdx < datedCount;
            const reorderArrowsHtml = (isItemLocked || isGrouped) ? '' : `
                <div class="slot-reorder-arrows">
                    <button class="arrow-btn" onclick="moveSlot(${realIdx}, -1)" title="Move Up">▲</button>
                    <button class="arrow-btn" onclick="moveSlot(${realIdx}, 1)" title="Move Down">▼</button>
                </div>
            `;

            const isWatched = s.status === 'Watched';
            const normCountry = normalizeCountryName(s.country);

            return `
            <div class="slot-card ${isWatched ? 'watched' : ''}" 
                 draggable="${!isGrouped}" 
                 ondragstart="handleDragStart(event, ${realIdx})" 
                 ondragover="handleDragOver(event)" 
                 ondrop="handleDrop(event, ${realIdx})" 
                 ondragend="handleDragEnd(event)">
                
                <div class="slot-top-right">
                    ${topRightIndicator}
                </div>

                <button class="slot-bottom-right-trash" onclick="${s.title ? `clearSlot(${realIdx})` : `removeSlot(${realIdx})`}" title="${s.title ? 'Clear slot' : 'Remove slot'}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>

                <div class="slot-poster-wrapper" onclick="${s.title ? '' : `openQuickSearch(event, ${realIdx})`}" title="${s.title ? 'Hover for categories' : 'Search TMDb'}">
                    ${posterHtml}
                    ${s.title ? tooltipHtml : ''}
                </div>
                <div class="slot-details">
                    <div>
                        <div class="slot-title ${s.title ? '' : 'empty-slot-trigger'}" id="quickSearchBox_${realIdx}">
                            ${titleLink}
                        </div>
                        ${s.title ? `
                            <div class="slot-meta-stacked">
                                <div class="slot-meta-row">${normCountry ? getCountryFlag(normCountry) + ' ' + escapeHtml(normCountry) : 'Country N/A'}</div>
                                <div class="slot-meta-row">${s.director ? 'Dir: ' + escapeHtml(s.director) : 'Director N/A'}</div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="slot-actions">
                        ${s.title ? `
                            <button class="watch-toggle-icon-btn ${isWatched ? 'is-watched' : ''}" onclick="handleWatchClick(${realIdx})" title="${isWatched ? 'Watched' : 'Mark Watched'}">
                                ${isWatched ? '✓' : GREY_EYE_HTML}
                            </button>
                        ` : ''}
                        <button class="edit-icon-btn" onclick="openModal(${realIdx})" title="${s.title ? 'Edit' : 'Add'}">
                            ...
                        </button>
                    </div>
                </div>

                ${reorderArrowsHtml}
            </div>
            `;
        }

        function render() {
            const watchedSlots = getWatchedSlots(slots);
            const watchedCount = watchedSlots.length;

            const decadeSet = new Set(watchedSlots.map(s => s.year ? Math.floor(s.year / 10) * 10 : null).filter(Boolean));
            const uniqueDecadesCount = decadeSet.size;

            const decadeMoviesMap = {};
            slots.forEach(s => {
                if (s.title && s.year) {
                    const dec = Math.floor(s.year / 10) * 10;
                    if (!decadeMoviesMap[dec]) decadeMoviesMap[dec] = [];
                    decadeMoviesMap[dec].push(s);
                }
            });

            const countryMoviesMap = {};
            slots.forEach(s => {
                if (s.title && s.country) {
                    const c = normalizeCountryName(s.country);
                    if (!countryMoviesMap[c]) countryMoviesMap[c] = [];
                    countryMoviesMap[c].push(s);
                }
            });

            const sortedCountries = Object.keys(countryMoviesMap).sort((a, b) => {
                const aWatched = countryMoviesMap[a].some(s => s.status === 'Watched');
                const bWatched = countryMoviesMap[b].some(s => s.status === 'Watched');
                if (aWatched && !bWatched) return -1;
                if (!aWatched && bWatched) return 1;
                return a.localeCompare(b);
            });

            const watchedCountriesCount = Object.keys(countryMoviesMap).filter(c => countryMoviesMap[c].some(s => s.status === 'Watched')).length;

            let clearedRules = 0;
            const rulesHtml = RULES_DEF.map(r => {
                const current = r.getCount(slots);
                const pass = current >= r.target;
                if (pass) clearedRules++;
                const isSelected = activeRuleFilter === r.id || (r.id === 'd9' && activeGroupMode === 'decades') || (r.id === 'c6' && activeGroupMode === 'countries');
                const isNonClickable = r.id === 'count31';
                return `<div class="rule-item ${pass ? 'complete' : ''} ${isNonClickable ? 'non-clickable' : ''}" style="${isSelected ? 'border-color: var(--accent-red); background: #1a1518;' : ''}" onclick="filterByRule('${r.id}')" title="${isNonClickable ? '' : 'Click to filter/group movies'}">
                    <div class="rule-left">
                        <div class="rule-status">${pass ? '✓' : '•'}</div>
                        <span>${r.label}</span>
                    </div>
                    ${r.target > 1 ? `<div class="rule-counter">${current} /${r.target}</div>` : ''}
                </div>`;
            }).join('');

            document.getElementById('rulesGrid').innerHTML = rulesHtml;
            document.getElementById('sidebarRulesCounter').innerText = `${clearedRules} / ${RULES_DEF.length}`;
            document.getElementById('progressVal').innerText = `${watchedCount}/31`;
            
            const testTubePercentage = Math.min(100, (watchedCount / 31) * 100);
            document.getElementById('testTubeFill').style.height = `${testTubePercentage}%`;

            document.getElementById('decadesVal').innerText = `${uniqueDecadesCount}/9`;
            document.getElementById('countriesVal').innerText = `${watchedCountriesCount}/6`;

            const decadesTagsContainer = document.getElementById('decadesTags');
            decadesTagsContainer.innerHTML = ALL_CINEMA_DECADES.map(d => {
                const isWatched = decadeSet.has(d);
                const moviesInDecade = sortMoviesForTooltip(decadeMoviesMap[d] || []);
                const hasMoviesInGrid = moviesInDecade.length > 0;
                const isMultiCol = moviesInDecade.length >= 16;
                
                const listItemsHtml = hasMoviesInGrid 
                    ? moviesInDecade.map(m => `
                        <li class="badge-tooltip-item ${m.status === 'Watched' ? 'watched-item' : 'planned-item'}">
                            ${escapeHtml(m.title)}
                        </li>
                    `).join('')
                    : `<li class="badge-tooltip-item empty-item">No movies planned</li>`;

                const tooltipContent = `
                    <div class="badge-tooltip ${isMultiCol ? 'multi-column' : ''}">
                        <div class="badge-tooltip-header">${d}s Movies</div>
                        <ul class="badge-tooltip-list ${isMultiCol ? 'grid-columns' : ''}">
                            ${listItemsHtml}
                        </ul>
                    </div>
                `;

                const badgeClass = isWatched 
                    ? 'watched-decade' 
                    : (hasMoviesInGrid ? 'planned-decade' : 'empty-decade');

                return `<span class="metric-badge ${badgeClass}">
                    ${d}s
                    ${tooltipContent}
                </span>`;
            }).join('');

            const countriesTagsContainer = document.getElementById('countriesTags');
            countriesTagsContainer.innerHTML = sortedCountries.length > 0 
                ? sortedCountries.map(c => {
                    const moviesInCountry = sortMoviesForTooltip(countryMoviesMap[c] || []);
                    const isCountryWatched = moviesInCountry.some(s => s.status === 'Watched');
                    const isMultiCol = moviesInCountry.length >= 16;

                    const tooltipContent = `
                        <div class="badge-tooltip ${isMultiCol ? 'multi-column' : ''}">
                            <div class="badge-tooltip-header">${escapeHtml(c)} Movies</div>
                            <ul class="badge-tooltip-list ${isMultiCol ? 'grid-columns' : ''}">
                                ${moviesInCountry.map(m => `
                                    <li class="badge-tooltip-item ${m.status === 'Watched' ? 'watched-item' : 'planned-item'}">
                                        ${escapeHtml(m.title)}
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    `;
                    return `<span class="metric-badge ${isCountryWatched ? 'watched-country' : 'planned-country'}">
                        ${getCountryFlag(c)} ${escapeHtml(c)}
                        ${tooltipContent}
                    </span>`;
                }).join('') 
                : `<span class="metric-badge empty-text">None logged yet</span>`;

            let htmlString = '';
            
            if (activeGroupMode) {
                htmlString += `
                    <div style="grid-column: 1 / -1; background: var(--bg-card); border: 1px solid var(--accent-red); padding: 12px 16px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <span style="font-size: 0.85rem; color: #fff;">Grouped by: <strong style="color: var(--accent-red);">${activeGroupMode === 'decades' ? 'decades' : 'countries'}</strong></span>
                        <button class="btn-secondary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="clearAllFilters()">Clear Filter</button>
                    </div>
                `;

                if (activeGroupMode === 'decades') {
                    const presentDecades = Array.from(new Set(slots.map(s => s.title && s.year ? Math.floor(s.year / 10) * 10 : null).filter(Boolean))).sort((a,b) => a - b);
                    
                    presentDecades.forEach(dec => {
                        const isDecadeFulfilled = decadeMoviesMap[dec] && decadeMoviesMap[dec].some(s => s.status === 'Watched');
                        htmlString += `
                            <div class="slot-demarcation">
                                <div class="slot-demarcation-line"></div>
                                <span class="slot-demarcation-label">
                                    ${dec}s
                                    ${isDecadeFulfilled ? `<span class="header-check" title="Decade fulfilled!">✓</span>` : ''}
                                </span>
                                <div class="slot-demarcation-line"></div>
                            </div>
                        `;
                        slots.forEach((s, realIdx) => {
                            if (s.title && s.year && Math.floor(s.year / 10) * 10 === dec) {
                                htmlString += renderSingleCard(s, realIdx, true);
                            }
                        });
                    });

                    const unassigned = slots.map((s, realIdx) => ({s, realIdx})).filter(obj => obj.s.title && !obj.s.year);
                    if (unassigned.length > 0) {
                        htmlString += `
                            <div class="slot-demarcation">
                                <div class="slot-demarcation-line"></div>
                                <span class="slot-demarcation-label">unknown decade</span>
                                <div class="slot-demarcation-line"></div>
                            </div>
                        `;
                        unassigned.forEach(obj => {
                            htmlString += renderSingleCard(obj.s, obj.realIdx, true);
                        });
                    }
                } else if (activeGroupMode === 'countries') {
                    const presentCountries = Array.from(new Set(slots.map(s => s.title && s.country ? normalizeCountryName(s.country) : null).filter(Boolean))).sort();

                    presentCountries.forEach(c => {
                        const isCountryFulfilled = countryMoviesMap[c] && countryMoviesMap[c].some(s => s.status === 'Watched');
                        htmlString += `
                            <div class="slot-demarcation">
                                <div class="slot-demarcation-line"></div>
                                <span class="slot-demarcation-label">
                                    ${getCountryFlag(c)} ${escapeHtml(c)}
                                    ${isCountryFulfilled ? `<span class="header-check" title="Country fulfilled!">✓</span>` : ''}
                                </span>
                                <div class="slot-demarcation-line"></div>
                            </div>
                        `;
                        slots.forEach((s, realIdx) => {
                            if (s.title && s.country && normalizeCountryName(s.country) === c) {
                                htmlString += renderSingleCard(s, realIdx, true);
                            }
                        });
                    });

                    const unassigned = slots.map((s, realIdx) => ({s, realIdx})).filter(obj => obj.s.title && !obj.s.country);
                    if (unassigned.length > 0) {
                        htmlString += `
                            <div class="slot-demarcation">
                                <div class="slot-demarcation-line"></div>
                                <span class="slot-demarcation-label">unknown country</span>
                                <div class="slot-demarcation-line"></div>
                            </div>
                        `;
                        unassigned.forEach(obj => {
                            htmlString += renderSingleCard(obj.s, obj.realIdx, true);
                        });
                    }
                }

                document.getElementById('slotsGrid').innerHTML = htmlString;
                return;
            }

            if (activeRuleFilter) {
                const filterRuleObj = RULES_DEF.find(r => r.id === activeRuleFilter);
                htmlString += `
                    <div style="grid-column: 1 / -1; background: var(--bg-card); border: 1px solid var(--accent-red); padding: 12px 16px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <span style="font-size: 0.85rem; color: #fff;">Filtering by rule: <strong style="color: var(--accent-red);">${filterRuleObj ? filterRuleObj.label : activeRuleFilter}</strong></span>
                        <button class="btn-secondary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="clearAllFilters()">Clear Filter</button>
                    </div>
                `;
            }

            slots.forEach((s, idx) => {
                if (activeRuleFilter) {
                    const ruleObj = RULES_DEF.find(r => r.id === activeRuleFilter);
                    let matches = false;
                    if (ruleObj) {
                        if (ruleObj.id === 'count31') matches = !!s.title;

        async function importGoogleSheet() {
            const rawInput = document.getElementById('sheetUrlInput').value.trim();
            if (!rawInput) { alert("Please select a file, paste a URL, or paste CSV text."); return; }

            if (rawInput.includes('Slot,Title,Year') || rawInput.includes('\n') || rawInput.includes(',')) {
                parseAndImportCsvData(rawInput);
                toggleGoogleSheetModal();
                return;
            }

            const match = rawInput.match(/\/d\/([a-zA-Z0-9-_]+)/);
            if (!match) { alert("Invalid Google Sheet URL format or CSV input."); return; }

            const sheetId = match[1];
            const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`;

            try {
                const res = await fetch(csvUrl);
                const csvText = await res.text();
                toggleGoogleSheetModal();
                parseAndImportCsvData(csvText);
            } catch (e) {
                alert("Failed to fetch Google Sheet CSV. Make sure the sheet is shared as 'Anyone with the link can view'.");
            }
        }

        function parseCsv(csvText) {
            const text = String(csvText || '').replace(/^\uFEFF/, '');
            const rows = [];
            let row = [];
            let cell = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (inQuotes) {
                    if (ch === '"') {
                        if (text[i + 1] === '"') { cell += '"'; i++; }
                        else { inQuotes = false; }
                    } else {
                        cell += ch;
                    }
                } else if (ch === '"') {
                    inQuotes = true;
                } else if (ch === ',') {
                    row.push(cell.trim());
                    cell = '';
                } else if (ch === '\n' || ch === '\r') {
                    if (ch === '\r' && text[i + 1] === '\n') i++;
                    row.push(cell.trim());
                    rows.push(row);
                    row = [];
                    cell = '';
                } else {
                    cell += ch;
                }
            }
            if (cell !== '' || row.length > 0) {
                row.push(cell.trim());
                rows.push(row);
            }
            return rows.filter(r => r.some(c => c !== ''));
        }

        function parseAndImportCsvData(csvText) {
            const rows = parseCsv(csvText);
            if (rows.length === 0) return;

            const firstLine = rows[0].join(',').toLowerCase();
            const isFullExport = firstLine.includes('slot') && firstLine.includes('title');

            if (isFullExport) {
                let restoredCount = 0;
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (row.length < 2) continue;

                    const slotIdx = parseInt(row[0], 10) - 1;
                    const title = row[1] || '';
                    if (!title) continue;

                    const year = parseInt(row[2], 10) || '';
                    const country = normalizeCountryName(row[3] || '');
                    const director = row[4] || '';
                    const tmdbId = row[5] || '';
                    const status = row[6] || 'Planned';
                    const viewingDate = row[7] || '';
                    const notes = row[8] || '';
                    const tagsRaw = row[9] || '';
                    const posterRaw = row[10] || '';
                    const poster = /^https:\/\/image\.tmdb\.org\//.test(posterRaw) ? posterRaw : '';
                    const parsedTags = tagsRaw ? tagsRaw.split('|').map(t => t.trim()).filter(Boolean) : [];

                    const slotObj = {
                        id: (isNaN(slotIdx) || slotIdx < 0) ? (restoredCount + 1) : (slotIdx + 1),
                        title: title,
                        year: year,
                        country: country,
                        director: director,
                        poster: poster,
                        tmdbId: tmdbId,
                        status: status,
                        viewingDate: viewingDate,
                        notes: notes,
                        tags: parsedTags
                    };

                    const targetPos = (isNaN(slotIdx) || slotIdx < 0 || slotIdx >= 100) ? restoredCount : slotIdx;
                    
                    while (slots.length <= targetPos) {
                        addNewSlotWithoutModal();
                    }

                    slots[targetPos] = slotObj;
                    restoredCount++;
                }

                syncMissingPosters();

                if (isLockedByDate) {
                    applyDateSorting();
                } else {
                    saveState();
                }
                alert(`Successfully imported ${restoredCount} slots from CSV!`);
            } else {
                processImportedMovieTitles(parseCsvTitles(csvText));
            }
        }

        function parseCsvTitles(csvText) {
            const titles = new Set();

            parseCsv(csvText).forEach(cells => {
                cells.forEach(cell => {
                    if (cell && cell.length > 2 && !cell.toLowerCase().includes('category') && !cell.toLowerCase().includes('movie')) {
                        if (!cell.toLowerCase().includes('there must be') && !cell.toLowerCase().includes('unique countries')) {
                            const cleaned = cell.split('||')[0].trim();
                            titles.add(cleaned);
                        }
                    }
                });
            });

            return Array.from(titles);
        }

        async function processImportedMovieTitles(titleList) {
            const existingTitles = new Set(slots.map(s => s.title ? s.title.toLowerCase().trim() : ''));
            const apiKey = getTmdbAccess();
            let addedCount = 0;

            for (const rawTitle of titleList) {
                const cleanTitle = rawTitle.trim();
                if (!cleanTitle || existingTitles.has(cleanTitle.toLowerCase())) continue;

                if (apiKey) {
                    try {
                        const searchRes = await fetch(`${tmdbApiBase()}/3/search/movie?${tmdbKeyParam()}query=${encodeURIComponent(cleanTitle)}&include_adult=false`);
                        const searchData = await searchRes.json();

                        if (searchData.results && searchData.results.length > 0) {
                            const m = searchData.results[0];
                            
                            if (slots.some(s => s.tmdbId == m.id || (s.title && s.title.toLowerCase().trim() === m.title.toLowerCase().trim()))) {
                                continue;
                            }

                            let targetIdx = slots.findIndex(s => !s.title);
                            if (targetIdx === -1) {
                                addNewSlotWithoutModal();
                                targetIdx = slots.length - 1;
                            }

                            const detailRes = await fetch(`${tmdbApiBase()}/3/movie/${m.id}?${tmdbKeyParam()}append_to_response=credits`);
                            const detailData = await detailRes.json();

                            const directorObj = detailData.credits && detailData.credits.crew ? detailData.credits.crew.find(c => c.job === 'Director') : null;
                            const primaryCountry = detailData.production_countries && detailData.production_countries.length > 0 ? normalizeCountryName(detailData.production_countries[0].name) : '';

                            slots[targetIdx] = {
                                id: targetIdx + 1,
                                title: detailData.title,
                                year: detailData.release_date ? parseInt(detailData.release_date.split('-')[0]) : '',
                                country: primaryCountry,
                                director: directorObj ? directorObj.name : '',
                                poster: detailData.poster_path ? `https://image.tmdb.org/t/p/w185${detailData.poster_path}` : '',
                                tmdbId: detailData.id,
                                status: 'Planned', viewingDate: '', notes: '', tags: []
                            };
                            existingTitles.add(detailData.title.toLowerCase());
                            addedCount++;
                            continue;
                        }
                    } catch (e) { console.error(e); }
                }

                if (slots.some(s => s.title && s.title.toLowerCase().trim() === cleanTitle.toLowerCase())) {
                    continue;
                }

                let targetIdx = slots.findIndex(s => !s.title);
                if (targetIdx === -1) {
                    addNewSlotWithoutModal();
                    targetIdx = slots.length - 1;
                }

                slots[targetIdx] = {
                    id: targetIdx + 1,
                    title: cleanTitle,
                    year: '', country: '', director: '', poster: '', tmdbId: '',
                    status: 'Planned', viewingDate: '', notes: '', tags: []
                };
                existingTitles.add(cleanTitle.toLowerCase());
                addedCount++;
            }

            if (isLockedByDate) {
                applyDateSorting();
            } else {
                saveState();
            }
            alert(`Successfully added ${addedCount} new unique movies into your slots!`);
        }

                country: normalizeCountryName(document.getElementById('mCountry').value),
                director: document.getElementById('mDirector').value,
                tmdbId: tmdbIdVal,
                poster: posterVal,
                status: document.getElementById('mStatus').value,
                viewingDate: document.getElementById('mViewingDate').value,
                notes: document.getElementById('mNotes').value,
                tags: tags
            };

            closeModal();
            if (isLockedByDate) {
                applyDateSorting();
            } else {
                saveState();
            }
            if (!posterVal && tmdbIdVal) syncMissingPosters();
        }

        function clearSlot(idx) {
            if (confirm(`Clear this slot?`)) {
                slots[idx] = { id: idx + 1, title: '', year: '', country: '', director: '', poster: '', tmdbId: '', status: 'Planned', viewingDate: '', notes: '', tags: [] };
                if (isLockedByDate) {
                    applyDateSorting();
                } else {
                    saveState();
                }
            }
        }

        function removeSlot(idx) {
            if (slots.length <= 1) return;
            slots.splice(idx, 1);
            if (isLockedByDate) {
                applyDateSorting();
            } else {
                saveState();
            }
        }

        function exportLetterboxd() {
            let text = "HOOPTOBER 13 PROGRESS\n\n";
            slots.forEach((s, idx) => {
                if (s.title) {
                    text += `${idx + 1}. ${s.title} (${s.year || 'N/A'}) - ${normalizeCountryName(s.country) || 'Unknown'} [Dir: ${s.director || 'N/A'}] ${s.status === 'Watched' ? '[WATCHED: ' + (s.viewingDate || 'No date') + ']' : '[PLANNED]'}\n`;
                }
            });
            navigator.clipboard.writeText(text);
            alert("Copied formatted list to clipboard!");
        }

        function exportCSV() {
            const csvCell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
            let csv = "Slot,Title,Year,Country,Director,TMDB_ID,Status,ViewingDate,Notes,Tags,Poster\n";
            slots.forEach(s => {
                const joinedTags = (s.tags && s.tags.length > 0) ? s.tags.join('|') : '';
                csv += [s.id, s.title, s.year, normalizeCountryName(s.country), s.director, s.tmdbId || '', s.status, s.viewingDate || '', s.notes, joinedTags, s.poster || ''].map(csvCell).join(',') + '\n';
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const link = document.getElementById('downloadLink') || document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', 'hooptober_13_progress_tracker_v71.csv');
            link.click();
        }

        renderApiConfig();
        initSync();
        if (isLockedByDate) {
            applyDateSorting();
        } else {
            saveState();
        }
        syncMissingPosters();
    </script>
</body>
</html>
