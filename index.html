<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hooptober 13 Horror Challenge Tracker v71</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0d0d0f;
            --bg-card: #16161a;
            --bg-card-hover: #1e1e24;
            --accent-red: #e50914;
            --accent-red-hover: #ff1e27;
            --accent-red-muted: #8b1e22;
            --text-main: #f0f0f5;
            --text-muted: #8e8e9e;
            --border-color: #2a2a35;
            --success-green: #2ecc71;
            --success-green-hover: #27ae60;
            --success-green-glow: rgba(46, 204, 113, 0.4);
            --success-green-bg: rgba(46, 204, 113, 0.15);
            --success-green-border: #2ecc71;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 24px; max-width: 1600px; margin: 0 auto; line-height: 1.5; }
        
        header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); margin-bottom: 24px; }
        
        .title-area { position: relative; display: inline-block; }
        .title-area h1 { font-family: 'Creepster', cursive, sans-serif; font-size: 2.8rem; color: var(--accent-red); letter-spacing: 2px; text-shadow: 2px 2px 8px rgba(229, 9, 20, 0.4); cursor: pointer; transition: color 0.2s; }
        .title-area h1:hover { color: var(--accent-red-hover); }

        .lee-popup {
            position: absolute;
            top: 105%;
            left: 0;
            width: 220px;
            height: auto;
            background: transparent;
            border: none;
            box-shadow: none;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px) scale(0.95);
            transition: opacity 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), visibility 0.3s;
            pointer-events: none;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-area:hover .lee-popup {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .lee-popup img {
            width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: contain;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 15px rgba(229, 9, 20, 0.75)) contrast(1.2);
            display: block;
        }

        .lee-popup-fallback {
            display: none;
            width: 180px;
            height: 180px;
            filter: drop-shadow(0 0 18px rgba(229, 9, 20, 0.85));
        }

        .top-right-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .api-config-bar { display: flex; align-items: center; gap: 8px; background: var(--bg-card); padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-color); }
        .api-status-badge { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--success-green); font-weight: 600; }
        .api-config-bar input { background: #000; border: 1px solid var(--border-color); color: #fff; padding: 4px 8px; border-radius: 4px; width: 160px; font-size: 0.8rem; }

        .tool-icon-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s, border-color 0.2s; font-size: 1rem; position: relative; }
        .tool-icon-btn:hover { background: var(--bg-card-hover); border-color: var(--accent-red); }

        .dropdown-menu { display: none; position: absolute; top: 110%; right: 0; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); z-index: 1000; min-width: 160px; overflow: hidden; }
        .dropdown-menu.active { display: block; }
        .dropdown-item { padding: 10px 14px; font-size: 0.85rem; color: var(--text-main); cursor: pointer; transition: background 0.15s; display: block; width: 100%; text-align: left; border: none; background: transparent; }
        .dropdown-item:hover { background: var(--accent-red); color: #fff; }

        .custom-modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 2000000; align-items: center; justify-content: center; padding: 20px; }
        .custom-modal-overlay.active { display: flex; }
        .custom-modal { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 460px; padding: 20px; position: relative; }

        button { background: var(--accent-red); color: white; border: none; padding: 8px 14px; border-radius: 4px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 0.85rem; }
        button:hover { background: var(--accent-red-hover); }
        button.btn-secondary { background: #2a2a35; color: var(--text-main); }
        button.btn-secondary:hover { background: #3a3a48; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; position: relative; z-index: auto; }
        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .metric-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: visible; z-index: auto; }
        .metric-card:hover { z-index: 5000; }
        
        .metric-header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .metric-card h3 { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 0; }
        .metric-value { font-size: 1.25rem; font-weight: bold; color: #fff; line-height: 1; }
        
        .metric-tags-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; flex-grow: 1; align-content: flex-start; position: relative; overflow: visible; }
        
        .metric-badge { 
            background: #111116; border: 1px solid var(--border-color); color: #727282; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px; position: relative; cursor: pointer;
        }
        .metric-badge:hover { z-index: 10000; }
        
        .metric-badge.watched-decade, .metric-badge.watched-country { 
            background: var(--success-green-bg); border-color: var(--success-green-border); color: #82e0aa; font-weight: bold;
        }
        .metric-badge.watched-decade:hover, .metric-badge.watched-country:hover { background: rgba(46, 204, 113, 0.28); }

        .metric-badge.planned-decade, .metric-badge.planned-country {
            background: #121216; border-color: #22222c; color: #555565;
        }
        .metric-badge.planned-decade:hover, .metric-badge.planned-country:hover { background: #1a1a22; border-color: #333342; color: var(--text-muted); }

        .metric-badge.empty-decade {
            background: #0d0d11; border-color: #1a1a22; color: #444452;
        }
        .metric-badge.empty-decade:hover { background: #14141c; border-color: #2a2a38; color: #666678; }

        .metric-badge .badge-tooltip {
            display: none;
            position: absolute;
            top: 130%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(22, 22, 28, 0.98);
            border: 1px solid var(--success-green-border);
            border-radius: 6px;
            padding: 8px 12px;
            width: 260px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.95);
            z-index: 999999;
            pointer-events: none;
            text-align: left;
        }

        .metric-badge .badge-tooltip.multi-column {
            min-width: 480px;
            max-width: 600px;
            width: max-content;
        }

        .metric-badge.planned-decade .badge-tooltip,
        .metric-badge.planned-country .badge-tooltip,
        .metric-badge.empty-decade .badge-tooltip { border-color: var(--border-color); }

        .metric-badge:hover .badge-tooltip { display: block; }

        .badge-tooltip-header { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--success-green); font-weight: bold; margin-bottom: 6px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
        .metric-badge.planned-decade .badge-tooltip-header,
        .metric-badge.planned-country .badge-tooltip-header,
        .metric-badge.empty-decade .badge-tooltip-header { color: var(--text-muted); }

        .badge-tooltip-list { list-style: none; display: flex; flex-direction: column; gap: 4px; max-height: 60vh; overflow-y: auto; padding-right: 4px; }
        
        .badge-tooltip-list.grid-columns {
            display: block;
            columns: 2;
            column-gap: 18px;
        }

        .badge-tooltip-item { 
            font-size: 0.78rem; 
            line-height: 1.35; 
            white-space: normal; 
            word-wrap: break-word; 
            margin-bottom: 4px;
            break-inside: avoid;
            page-break-inside: avoid;
        }
        .badge-tooltip-item.watched-item { color: #eee; font-weight: 500; }
        .badge-tooltip-item.watched-item::before { content: '• '; color: var(--success-green); font-weight: bold; }
        
        .badge-tooltip-item.planned-item { color: #888898; }
        .badge-tooltip-item.planned-item::before { content: '• '; color: #555566; }

        .badge-tooltip-item.empty-item { color: #555562; font-style: italic; }

        .metric-badge.empty-text { border: none; background: transparent; color: var(--text-muted); font-style: italic; padding: 0; cursor: default; }

        .test-tube-container { display: flex; align-items: center; justify-content: center; flex-grow: 1; margin-top: 8px; }
        .test-tube-wrapper { display: flex; flex-direction: column; align-items: center; position: relative; }
        .test-tube-rim { width: 22px; height: 5px; background: #444455; border-radius: 2px; border: 1px solid #666677; z-index: 2; }
        .test-tube { 
            width: 18px; height: 48px; border: 2px solid #555566; border-top: none; border-radius: 0 0 10px 10px; position: relative; background: rgba(13, 13, 15, 0.9); overflow: hidden; display: flex; align-items: flex-end; box-shadow: inset 0 0 6px rgba(0,0,0,0.8); 
        }
        .test-tube-fill { 
            width: 100%; background: linear-gradient(0deg, #1e8449, var(--success-green)); height: 0%; transition: height 0.4s ease; box-shadow: 0 0 10px var(--success-green-glow); position: relative; 
        }
        .test-tube::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 3px;
            height: 36px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            pointer-events: none;
        }

        .app-layout { display: grid; grid-template-columns: 1fr 340px; gap: 24px; align-items: start; position: relative; z-index: auto; }
        @media (max-width: 1100px) { .app-layout { grid-template-columns: 1fr; } }

        .controls-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .search-container { position: relative; flex-grow: 1; max-width: 480px; }
        .search-container input { width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); color: #fff; padding: 10px 14px; border-radius: 6px; font-size: 0.9rem; }
        .search-results { position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; margin-top: 4px; max-height: 380px; overflow-y: auto; z-index: 500; box-shadow: 0 10px 25px rgba(0,0,0,0.85); }
        .search-result-item { display: flex; gap: 12px; padding: 10px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background 0.15s; }
        .search-result-item:hover { background: var(--bg-card-hover); }
        .search-result-item img { width: 40px; height: 60px; object-fit: cover; border-radius: 4px; background: #2a2a35; }

        .lock-control-inline { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; color: var(--text-muted); cursor: pointer; background: var(--bg-card); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border-color); }
        .lock-control-inline input { width: 12px; height: 12px; accent-color: var(--accent-red); cursor: pointer; }

        .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; position: relative; z-index: auto; }
        @media (max-width: 1400px) { .slots-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .slots-grid { grid-template-columns: 1fr; } }

        .slot-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            gap: 12px;
            position: relative;
            min-height: 130px;
            cursor: grab;
            transition: transform 0.15s ease, border-color 0.15s ease;
            z-index: 1;
        }
        .slot-card:hover { z-index: 10000; }
        .slot-card:active { cursor: grabbing; }
        .slot-card.dragging { opacity: 0.4; border: 2px dashed var(--accent-red); }
        .slot-card.watched { border-left: 4px solid var(--success-green); background: #141a16; }

        .slot-card.add-card-tile {
            background: transparent;
            border: 2px dashed var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            min-height: 130px;
            border-radius: 8px;
            transition: border-color 0.2s, background 0.2s;
        }
        .slot-card.add-card-tile:hover {
            border-color: var(--accent-red);
            background: rgba(229, 9, 20, 0.05);
        }
        .add-card-plus {
            font-size: 2.5rem;
            color: var(--text-muted);
            font-weight: 300;
            line-height: 1;
            transition: color 0.2s;
        }
        .slot-card.add-card-tile:hover .add-card-plus { color: var(--accent-red); }
        
        .slot-top-right {
            position: absolute;
            top: 10px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 5;
        }

        .slot-bottom-right-trash {
            position: absolute;
            bottom: 10px;
            right: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            opacity: 0.35;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 2px;
            transition: opacity 0.2s, color 0.2s;
            z-index: 5;
        }
        .slot-bottom-right-trash:hover {
            opacity: 1;
            color: var(--accent-red);
            background: transparent;
        }

        .slot-num-text { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; }

        .slot-reorder-arrows {
            position: absolute;
            bottom: 34px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 1px;
            opacity: 0.3;
            transition: opacity 0.2s;
            z-index: 5;
        }
        .slot-card:hover .slot-reorder-arrows { opacity: 1; }

        .arrow-btn {
            background: #252530;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 18px;
            height: 16px;
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        .arrow-btn:hover { background: var(--accent-red); border-color: var(--accent-red); }

        .slot-poster-wrapper { 
            width: 65px; height: 98px; border-radius: 4px; overflow: visible; background: #111116; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); position: relative; cursor: pointer;
            z-index: 50;
        }
        .slot-poster-wrapper:hover { z-index: 50000; }
        .slot-poster { width: 100%; height: 100%; object-fit: cover; border-radius: 3px; }
        .slot-poster-svg { width: 42px; height: 42px; opacity: 0.7; }

        .slot-details { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; padding-right: 25px; position: relative; z-index: 2; }
        
        .slot-title { font-size: 0.92rem; font-weight: bold; color: #fff; padding-right: 30px; line-height: 1.3; position: relative; }
        .slot-title a { color: #fff; text-decoration: none; }
        .slot-title a:hover { color: var(--accent-red-hover); text-decoration: underline; }
        .slot-title.empty-slot-trigger { color: var(--text-muted); font-weight: normal; font-size: 0.92rem; cursor: pointer; transition: color 0.15s; }
        .slot-title.empty-slot-trigger:hover { color: var(--accent-red-hover); text-decoration: underline; }
        .year-paren { font-weight: normal; color: var(--text-muted); font-size: 0.85rem; margin-left: 4px; }

        .inline-search-popover {
            display: none;
            position: absolute;
            top: -6px;
            left: -8px;
            right: 0;
            background: #181820;
            border: 1px solid var(--accent-red);
            border-radius: 6px;
            padding: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            z-index: 800;
        }
        .inline-search-popover.active { display: block; }
        .inline-search-popover input {
            width: 100%;
            background: #09090c;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.82rem;
        }

        .poster-tooltip {
            display: none;
            position: absolute;
            bottom: 110%;
            left: 0;
            background: rgba(28, 28, 36, 0.98);
            border: 1px solid var(--accent-red);
            border-radius: 6px;
            padding: 10px 12px;
            width: 230px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.95);
            z-index: 999999;
            pointer-events: none;
            opacity: 0.98;
        }
        .poster-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 18px;
            border-width: 6px;
            border-style: solid;
            border-color: var(--accent-red) transparent transparent transparent;
        }
        .slot-poster-wrapper:hover .poster-tooltip { display: block; }

        .tooltip-header { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent-red); font-weight: bold; margin-bottom: 6px; }
        .tooltip-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
        .tooltip-item { font-size: 0.75rem; color: #eee; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .tooltip-item-left { display: flex; align-items: center; gap: 6px; }
        .tooltip-item-left::before { content: '•'; color: var(--accent-red); font-weight: bold; }
        .tooltip-item-check { color: var(--success-green); font-weight: bold; font-size: 0.8rem; }

        .slot-meta-stacked { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; display: flex; flex-direction: column; gap: 1px; }
        .slot-meta-row { line-height: 1.3; }

        .slot-demarcation {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0 8px 0;
        }
        .slot-demarcation-line {
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-color), rgba(229, 9, 20, 0.4), var(--border-color));
        }
        .slot-demarcation-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: bold;
            background: var(--bg-main);
            padding: 0 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: lowercase;
        }

        .header-check { color: var(--success-green); font-weight: bold; font-size: 0.85rem; }

        .calendar-badge {
            width: 26px;
            height: 28px;
            background: #d8d8e0;
            border-radius: 3px;
            overflow: hidden;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }
        .calendar-badge-header {
            background: var(--accent-red-muted);
            color: #ececec;
            width: 100%;
            text-align: center;
            font-size: 0.48rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 1px 0;
            line-height: 1;
            letter-spacing: 0.3px;
        }
        .calendar-badge-day {
            color: #1a1a20;
            font-weight: 800;
            font-size: 0.72rem;
            line-height: 1.1;
            margin-top: 1px;
        }

        .watch-toggle-icon-btn { 
            display: flex !important; 
            align-items: center !important; 
            justify-content: center !important; 
            background: #252530; 
            border: 1px solid var(--border-color); 
            color: #d0d0e0; 
            width: 30px !important; 
            height: 30px !important; 
            border-radius: 4px; 
            cursor: pointer; 
            transition: all 0.15s;
            flex-shrink: 0 !important;
            position: relative;
            z-index: 99 !important;
            padding: 0;
            line-height: 1;
        }
        .watch-toggle-icon-btn:hover { background: #3a3a48; border-color: var(--accent-red); color: #ffffff; }
        .watch-toggle-icon-btn.is-watched { background: #14281a; color: #2ecc71; border-color: #1e3f28; font-weight: bold; }

        .edit-icon-btn { display: inline-flex; align-items: center; justify-content: center; background: #252530; border: 1px solid var(--border-color); color: #ccc; width: 30px; height: 30px; border-radius: 4px; font-size: 0.9rem; cursor: pointer; flex-shrink: 0; z-index: 10; }
        .edit-icon-btn:hover { background: #3a3a48; color: #fff; }

        .slot-actions { display: flex; gap: 6px; margin-top: 8px; align-items: center; position: relative; z-index: 99; }

        .sidebar-rules-panel { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 18px; position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow-y: auto; }
        .sidebar-rules-panel h2 { font-size: 1rem; margin-bottom: 12px; color: #fff; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-rules-list { display: flex; flex-direction: column; gap: 8px; }
        .rule-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; background: #101014; padding: 8px 10px; border-radius: 6px; border: 1px solid #1f1f28; cursor: pointer; transition: background 0.15s; }
        .rule-item:hover { background: #1a1a24; }
        .rule-item.non-clickable { cursor: default; }
        .rule-item.non-clickable:hover { background: #101014; }
        .rule-left { display: flex; align-items: center; gap: 8px; }
        .rule-status { width: 16px; height: 16px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #aaa; flex-shrink: 0; }
        .rule-item.complete .rule-status { background: var(--success-green); color: #000; font-weight: bold; }
        .rule-counter { font-size: 0.7rem; font-weight: bold; color: var(--text-muted); background: #1c1c24; padding: 2px 6px; border-radius: 4px; }
        .rule-item.complete .rule-counter { color: var(--success-green); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 2000000; align-items: center; justify-content: center; padding: 16px; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 900px; padding: 24px; max-height: 94vh; overflow: visible; position: relative; }
        .sync-wrap { display: flex; align-items: center; gap: 6px; }
        .sync-status { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; }
        .sync-status.ok { color: var(--success-green); }
        .sync-status.warn { color: #f5b041; }
        .sync-status.err { color: var(--accent-red-hover); }
        .sync-code-box { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.05rem; letter-spacing: 1px; background: #000; border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 12px; color: #fff; text-align: center; user-select: all; word-break: break-all; }
        .sync-modal-text { font-size: 0.85rem; color: var(--text-muted); line-height: 1.45; margin-bottom: 12px; }
        .sync-modal-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .sync-code-input { width: 100%; background: #000; border: 1px solid var(--border-color); color: #fff; padding: 10px 12px; border-radius: 6px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.95rem; text-transform: uppercase; }
        .modal-close-btn { position: absolute; top: 12px; right: 16px; background: transparent; border: none; color: var(--text-muted); font-size: 1.4rem; font-weight: bold; cursor: pointer; padding: 0; line-height: 1; }
        .modal-close-btn:hover { color: var(--text-main); background: transparent; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; background: #0d0d0f; border: 1px solid var(--border-color); color: #fff; padding: 7px 10px; border-radius: 4px; font-size: 0.85rem; }
        
        .modal-grid-compact { display: grid; grid-template-columns: 100px 1fr 100px 50px 160px; gap: 10px; align-items: end; }
        @media (max-width: 700px) { .modal-grid-compact { grid-template-columns: 1fr; } }

        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

        .checkbox-scroll-box { background: #0d0d0f; border: 1px solid var(--border-color); border-radius: 4px; padding: 10px; }
        .checkbox-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 16px; }
        .checkbox-grid label { display: flex; align-items: flex-start; gap: 6px; font-size: 0.78rem; color: var(--text-main); cursor: pointer; line-height: 1.25; }
        .checkbox-grid input[type="checkbox"] { margin-top: 1px; flex-shrink: 0; width: 14px; height: 14px; accent-color: var(--accent-red); cursor: pointer; }
    </style>
</head>

                        <svg width="18" height="18" viewBox="0 0 24 24" style="display:block;"><path fill="#d0d0e0" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>

    <script>
        function handleLeeImgError() {
            const img = document.getElementById('leeImg');
            const svgFallback = document.getElementById('leeFallbackSvg');
            if (img) img.style.display = 'none';
            if (svgFallback) svgFallback.style.display = 'block';
        }

        const getWatchedSlots = slots => slots.filter(s => s.title && s.status === 'Watched');

        const SPOOKY_REEL_SVG = `
            <svg class="slot-poster-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="32" cy="32" r="26" stroke="#e50914" stroke-width="3" fill="#16161a"/>
                <circle cx="32" cy="32" r="8" fill="#e50914"/>
                <circle cx="32" cy="14" r="5" fill="#0d0d0f" stroke="#e50914" stroke-width="2"/>
                <circle cx="32" cy="50" r="5" fill="#0d0d0f" stroke="#e50914" stroke-width="2"/>
                <circle cx="14" cy="32" r="5" fill="#0d0d0f" stroke="#e50914" stroke-width="2"/>
                <circle cx="50" cy="32" r="5" fill="#0d0d0f" stroke="#e50914" stroke-width="2"/>
                <path d="M16 16 L24 24 M48 16 L40 24 M16 48 L24 40 M48 48 L40 40" stroke="#3a3a48" stroke-width="2" stroke-linecap="round"/>
            </svg>
        `;

        const GREY_EYE_HTML = `<svg width="18" height="18" viewBox="0 0 24 24" style="display:block; min-width:18px; min-height:18px;"><path fill="#d0d0e0" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>`;

        const NO_POSTER_THUMB = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="60" viewBox="0 0 40 60"><rect width="40" height="60" fill="#2a2a35"/><circle cx="20" cy="30" r="9" fill="none" stroke="#e50914" stroke-width="2"/><circle cx="20" cy="30" r="2.5" fill="#e50914"/></svg>');

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        const COUNTRY_FLAGS = {
            'united states of america': '🇺🇸', 'united states': '🇺🇸', 'usa': '🇺🇸', 'us': '🇺🇸',
            'united kingdom': '🇬🇧', 'uk': '🇬🇧',
            'japan': '🇯🇵', 'jp': '🇯🇵',
            'italy': '🇮🇹', 'it': '🇮🇹',
            'canada': '🇨🇦', 'ca': '🇨🇦',
            'france': '🇫🇷', 'fr': '🇫🇷',
            'germany': '🇩🇪', 'de': '🇩🇪',
            'spain': '🇪🇸', 'es': '🇪🇸',
            'mexico': '🇲🇽', 'mx': '🇲🇽',
            'south korea': '🇰🇷', 'kr': '🇰🇷',
            'australia': '🇦🇺', 'au': '🇦🇺',
            'netherlands': '🇳🇱', 'nl': '🇳🇱'
        };

        function normalizeCountryName(countryName) {
            if (!countryName) return '';
            const clean = countryName.trim().toLowerCase();
            if (clean === 'united states of america' || clean === 'united states' || clean === 'us' || clean === 'usa') return 'USA';
            if (clean === 'united kingdom' || clean === 'uk') return 'UK';
            return countryName.trim();
        }

        function getCountryFlag(countryName) {
            if (!countryName) return '🌐';
            const clean = countryName.trim().toLowerCase();
            return COUNTRY_FLAGS[clean] || '🌐';
        }

        const MONTH_ABBRS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        function getCalendarIconHtml(dateString) {
            if (!dateString) return '';
            const parts = dateString.split('-');
            if (parts.length < 3) return '';
            const monthIdx = parseInt(parts[1], 10) - 1;
            const dayNum = parseInt(parts[2], 10);
            const monthAbbr = MONTH_ABBRS[monthIdx] || '???';

            return `
                <div class="calendar-badge" title="Watched on ${dateString}">
                    <div class="calendar-badge-header">${monthAbbr}</div>
                    <div class="calendar-badge-day">${dayNum}</div>
                </div>
            `;
        }

        const RULES_DEF = [
            { id: 'count31', label: '31 Films Total Watched', target: 31, getCount: slots => getWatchedSlots(slots).length, appliesTo: s => !!s.title },
            { id: 'c6', label: '6 Unique Countries', target: 6, getCount: slots => new Set(getWatchedSlots(slots).map(s => normalizeCountryName(s.country)).filter(Boolean)).size, appliesTo: s => !!s.country },
            { id: 'd9', label: '9 Unique Decades', target: 9, getCount: slots => new Set(getWatchedSlots(slots).map(s => s.year ? Math.floor(s.year/10)*10 : null).filter(Boolean)).size, appliesTo: s => !!s.year },
            { id: 'sequels', label: '5 Sequels', target: 5, getCount: slots => getWatchedSlots(slots).filter(s => s.tags && s.tags.includes('Sequel')).length, appliesTo: s => !!s.title && s.tags && s.tags.includes('Sequel') },
            { id: 'manfredini', label: '2 Harry Manfredini Scores', target: 2, getCount: slots => getWatchedSlots(slots).filter(s => s.tags && s.tags.includes('Harry Manfredini')).length, appliesTo: s => !!s.title && s.tags && s.tags.includes('Harry Manfredini') },
            { id: 'lugosi', label: '2 Bela Lugosi Films', target: 2, getCount: slots => getWatchedSlots(slots).filter(s => s.tags && s.tags.includes('Bela Lugosi')).length, appliesTo: s => !!s.title && s.tags && s.tags.includes('Bela Lugosi') },
            { id: 'smg', label: '2 Screaming Mad George Films', target: 2, getCount: slots => getWatchedSlots(slots).filter(s => s.tags && s.tags.includes('Screaming Mad George')).length, appliesTo: s => !!s.title && s.tags && s.tags.includes('Screaming Mad George') },

        async function performQuickSearch(idx) {
            const inp = document.getElementById(`quickInput_${idx}`);

            const query = inp.value.trim();
            const apiKey = getTmdbAccess();
            const resultsBox = document.getElementById(`quickResults_${idx}`);

            try {
                const res = await fetch(`${tmdbApiBase()}/3/search/movie?${tmdbKeyParam()}query=${encodeURIComponent(query)}&include_adult=false`);

        async function selectMovieForSlot(tmdbId, targetIdx) {
            const apiKey = getTmdbAccess();
            closeQuickSearch();

            try {
                const res = await fetch(`${tmdbApiBase()}/3/movie/${tmdbId}?${tmdbKeyParam()}append_to_response=credits`);
                const data = await res.json();
                if (!data || !data.title) { alert("Could not find movie on TMDb for ID: " + tmdbId); return; }

                const existing = slots.find((s, i) => i !== targetIdx && (s.tmdbId == data.id || (s.title && s.title.toLowerCase().trim() === data.title.toLowerCase().trim())));
                if (existing) {
                    alert(`Duplicate Warning: "${data.title}" is already present in slot #${existing.id}!`);
                    return;
                }

                const directorObj = data.credits && data.credits.crew ? data.credits.crew.find(c => c.job === 'Director') : null;
                const primaryCountry = data.production_countries && data.production_countries.length > 0 ? normalizeCountryName(data.production_countries[0].name) : '';

                slots[targetIdx] = {
                    id: targetIdx + 1,
                    title: data.title,
                    year: data.release_date ? parseInt(data.release_date.split('-')[0]) : '',
                    country: primaryCountry,
                    director: directorObj ? directorObj.name : '',
                    poster: data.poster_path ? `https://image.tmdb.org/t/p/w185${data.poster_path}` : '',
                    tmdbId: data.id,
                    status: 'Planned', viewingDate: '', notes: '', tags: []
                };

                if (isLockedByDate) {
                    applyDateSorting();
                } else {
                    saveState();
                }
            } catch (e) { alert('Error fetching TMDb details.'); }
        }

        function toggleLockByDate(checkbox) {

            localStorage.setItem('hoop13_locked', JSON.stringify(isLockedByDate));
            if (isLockedByDate) {
                applyDateSorting();
            } else {
